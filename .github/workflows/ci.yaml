name: ci-golang-workflow
on:
  pull_request:
    branches:
      - develop

jobs: 
  check-application:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     go: ['1.14', '1.15']

    steps:
        - uses: actions/checkout@v2
        - uses: actions/setup-go@v2
          with:
            # go-version: ${{ matrix.go }}
            go-version: 1.15
        - run: go test
        - run: go run math.go

        - name: Set up QEMU
          uses: docker/setup-qemu-action@v3

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push
          id: docker_build #able other steps to use the same state
          uses: docker/build-push-action@v6
          with:
            push: false
            tags: leonardo-santoz/fullcycle-ci-go:latest #image name
